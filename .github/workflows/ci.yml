name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Each job runs where opam would really take its path:
        #   system   — ubuntu-26.04 and Homebrew package libxgboost >= 3.0,
        #              which opam installs through conf-libxgboost's depext.
        #   vendored — ubuntu-24.04 is outside xgboost.opam's
        #              conf-libxgboost filter and only packages libxgboost
        #              < 3.0, so opam (and opam-repo-ci) builds
        #              vendor/xgboost with CMake there, with no system lib.
        # Vendored runs on the oldest supported (4.11) and newest compiler;
        # the in-between versions run the system path only. macOS vendored
        # stands in for MacPorts and --no-depexts users (see below).
        include:
          - { os: ubuntu-26.04, ocaml-version: "4.11", mode: system }
          - { os: ubuntu-26.04, ocaml-version: "5.1", mode: system }
          - { os: ubuntu-26.04, ocaml-version: "5.2", mode: system }
          - { os: ubuntu-26.04, ocaml-version: "5.3", mode: system }
          - { os: ubuntu-26.04, ocaml-version: "5.5", mode: system }
          - { os: ubuntu-24.04, ocaml-version: "4.11", mode: vendored }
          - { os: ubuntu-24.04, ocaml-version: "5.5", mode: vendored }
          - { os: macos-latest, ocaml-version: "5.3", mode: system }
          - { os: macos-latest, ocaml-version: "5.3", mode: vendored }

    runs-on: ${{ matrix.os }}

    env:
      # Run libxgboost single-threaded so the test suite is fully
      # deterministic. Hist OpenMP reduction order varies with chunk
      # size and thread count, which makes a few qcheck properties
      # (slice consistency, model-buffer round-trip) drift by ~1e-4
      # — the binding is correct, libxgboost just has FP noise. Pin
      # threads to 1 in CI; bench harness can override.
      OMP_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      # cmake/g++/libgomp are needed everywhere: the conf-cmake/conf-c++
      # build-deps check for them, and the vendored path builds with them.
      - name: Install build toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake g++ libgomp1

      # The distro package, as conf-libxgboost's depext installs it on
      # Ubuntu >= 25.10 (3.0.4 on 26.04). The exact 3.0.0 minimum is
      # covered by the Distros workflow's Debian 13 job.
      - name: Install system libxgboost (system mode only)
        if: runner.os == 'Linux' && matrix.mode == 'system'
        run: sudo apt-get install -y libxgboost-dev

      - name: Install macOS build toolchain
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libomp

      # On Homebrew, xgboost.opam depends on conf-libxgboost, whose build
      # probes `pkg-config --exists xgboost`, and opam's depext always
      # installs brew xgboost, so Homebrew users never vendor. The vendored
      # job installs it anyway to get through the deps install, then hides
      # it with an empty PKG_CONFIG_LIBDIR (below) to exercise the macOS
      # vendored build (-force_load, keg-only libomp) that MacPorts and
      # --no-depexts users get. No macOS runner comes without Homebrew.
      - name: Install macOS system XGBoost
        if: runner.os == 'macOS'
        run: brew install xgboost

      # OCaml 4.11's runtime declares primitives as `value (*)()`, which
      # C23 (GCC 15's default, on ubuntu-26.04) reads as taking no
      # arguments, so the compiler build fails in interp.c. Build it as
      # gnu11. Also set on the 24.04 vendored job (where GCC 13 doesn't need
      # it): the vendored build links its shared companions with OCaml's
      # recorded c_compiler, and this keeps a compiler-with-flags case
      # covered.
      - name: Set up OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        env:
          CC: ${{ matrix.ocaml-version == '4.11' && runner.os == 'Linux' && 'gcc -std=gnu11' || '' }}
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      # --no-depexts: system deps are installed explicitly above, matching
      # what the depexts would install, so each job's native setup is
      # fixed by this file rather than by opam's solver.
      - name: Install OCaml deps
        run: opam install ./xgboost.opam --deps-only --with-test --no-depexts --yes

      # Hides brew xgboost on macOS; on ubuntu-24.04 there is nothing to
      # hide, and this guards against a runner image that ships a .pc.
      - name: Force vendored discovery
        if: matrix.mode == 'vendored'
        run: |
          mkdir -p "$RUNNER_TEMP/empty-pkgconfig"
          echo 'PKG_CONFIG_PATH=' >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/empty-pkgconfig" >> "$GITHUB_ENV"

      - name: Lint opam metadata
        run: opam lint xgboost.opam

      # Vendored mode: keep dune's cache between runs, so the CMake build of
      # vendor/xgboost (the config/ rule) is restored instead of redone.
      # Dune tracks the rule's declared inputs (discover.exe, vendor/), not
      # the C++ compiler or OpenMP it uses, so the key also names the
      # runner image (ImageOS, e.g. ubuntu24 / macos15). One entry per key:
      # on an exact hit actions/cache saves nothing, so the entry neither
      # multiplies per run nor grows; a change to vendor/ or config/ makes
      # a new key.
      - name: Compute dune cache key
        if: matrix.mode == 'vendored'
        id: dune-cache-key
        run: echo "prefix=dune-${{ runner.os }}-${{ runner.arch }}-${ImageOS:-unknown}-ocaml${{ matrix.ocaml-version }}-${{ hashFiles('vendor/**', 'config/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dune cache
        if: matrix.mode == 'vendored'
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune-cache-key.outputs.prefix }}

      # DUNE_CACHE=enabled also caches user rules (the CMake build is one);
      # dune's default mode skips them. check-installed-linking.sh disables
      # the cache itself for its fresh builds.
      - name: Build
        env:
          DUNE_CACHE: ${{ matrix.mode == 'vendored' && 'enabled' || 'disabled' }}
        run: opam exec -- dune build -p xgboost -j 4

      - name: Run tests
        env:
          DUNE_CACHE: ${{ matrix.mode == 'vendored' && 'enabled' || 'disabled' }}
        run: opam exec -- dune runtest -p xgboost -j 4

      # Reuse the build above instead of building (and, in vendored mode,
      # compiling XGBoost) a second time. DUNE_CACHE must match the Build
      # step's: switching it from enabled to disabled makes dune re-run
      # user rules, the CMake build among them.
      - name: Check installed consumer linking
        env:
          REUSE_BUILD: "1"
          DUNE_CACHE: ${{ matrix.mode == 'vendored' && 'enabled' || 'disabled' }}
        run: bash scripts/check-installed-linking.sh "$GITHUB_WORKSPACE" "${{ matrix.mode }}"

      # The pure-C reference and the ASan run both link the system
      # libxgboost, so they only make sense on the system-mode job.
      - name: Build C reference
        if: runner.os == 'Linux' && matrix.mode == 'system'
        run: make -C bin/c_reference

      - name: Run tests under AddressSanitizer
        if: runner.os == 'Linux' && matrix.mode == 'system'
        run: ./scripts/run-asan.sh
