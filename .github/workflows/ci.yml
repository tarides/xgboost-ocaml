name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two OCaml versions on each platform: the latest release (5.5) and the
  # declared minimum (4.11, `ocaml >= 4.11` in xgboost.opam), except on
  # macOS where the oldest usable one is 4.12 (see below). Each job
  # runs where opam would really take its native path:
  #   system   — ubuntu-latest and Homebrew package libxgboost >= 3.0,
  #              which opam installs through conf-libxgboost's depext.
  #   vendored — Debian 12 packages only libxgboost < 3.0 and is outside
  #              conf-libxgboost's filter, so opam builds vendor/xgboost
  #              with CMake there, with no system lib (job below).
  system:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ocaml-version: "5.5" }
          - { os: ubuntu-latest, ocaml-version: "4.11" }
          - { os: macos-latest, ocaml-version: "5.5" }
          # Not 4.11: it predates arm64 macOS (ocaml-base-compiler.4.11.2 is
          # unavailable there), and even on Intel its empty-archive
          # workaround (`ar d x.a /dev/null`) is rejected by macOS 26's ar,
          # so packages with empty libraries (stdlib-shims) don't build.
          # 4.12 supports arm64 and doesn't call ar for empty archives.
          - { os: macos-latest, ocaml-version: "4.12" }

    runs-on: ${{ matrix.os }}

    env:
      # Run libxgboost single-threaded so the test suite is fully
      # deterministic. Hist OpenMP reduction order varies with chunk
      # size and thread count, which makes a few qcheck properties
      # (slice consistency, model-buffer round-trip) drift by ~1e-4
      # — the binding is correct, libxgboost just has FP noise. Pin
      # threads to 1 in CI; bench harness can override.
      OMP_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      # cmake/g++/libgomp: the conf-cmake/conf-c++ build-deps check for
      # them. libxgboost-dev is the distro package, as conf-libxgboost's
      # depext installs it on Ubuntu >= 25.10. The exact 3.0.0 minimum is
      # covered by the Distros workflow's Debian 13 job.
      - name: Install toolchain and libxgboost (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake g++ libgomp1 libxgboost-dev

      # brew xgboost is what conf-libxgboost's depext installs on Homebrew.
      - name: Install toolchain and libxgboost (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config libomp xgboost

      # OCaml 4.11's runtime declares primitives as `value (*)()`, which
      # C23 (GCC 15's default, on ubuntu-latest = 26.04) reads as taking no
      # arguments, so the compiler build fails in interp.c. Build it as
      # gnu11. Other versions and macOS (clang) keep the default compiler.
      - name: Set up OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        env:
          CC: ${{ matrix.ocaml-version == '4.11' && runner.os == 'Linux' && 'gcc -std=gnu11' || '' }}
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      # --no-depexts: system deps are installed explicitly above, matching
      # what the depexts would install, so each job's native setup is
      # fixed by this file rather than by opam's solver.
      - name: Install OCaml deps
        run: opam install ./xgboost.opam --deps-only --with-test --no-depexts --yes

      # Also the conf-libxgboost template published to opam-repository.
      - name: Lint opam metadata
        run: opam lint xgboost.opam packaging/conf-libxgboost.opam

      - name: Build
        run: opam exec -- dune build -p xgboost -j 4

      - name: Run tests
        run: opam exec -- dune runtest -p xgboost -j 4

      # Reuses the build above (REUSE_BUILD).
      - name: Check installed consumer linking
        env:
          REUSE_BUILD: "1"
        run: bash scripts/check-installed-linking.sh "$GITHUB_WORKSPACE" system

      # The pure-C reference and the ASan run link the system libxgboost;
      # once is enough. The ASan run preloads libasan without
      # instrumenting anything: it checks the allocator and libc calls
      # only (see run-asan.sh).
      - name: Build C reference
        if: runner.os == 'Linux' && matrix.ocaml-version == '5.5'
        run: make -C bin/c_reference

      - name: Run tests under AddressSanitizer
        if: runner.os == 'Linux' && matrix.ocaml-version == '5.5'
        run: ./scripts/run-asan.sh

      # ocaml.org builds the API docs after a release; catch odoc errors
      # in xgboost.mli before that.
      - name: Build documentation
        if: runner.os == 'Linux' && matrix.ocaml-version == '5.5'
        run: |
          opam install odoc --yes
          opam exec -- dune build -p xgboost @doc

  # Vendored path inside opam-repository CI's ocaml/opam images, with
  # opam installing the depexts itself. Debian 12 packages only libxgboost
  # < 3.0 and Alpine none, and both are outside conf-libxgboost's filter,
  # so opam vendors there for real. Alpine adds musl (where #19's crash
  # only showed) and arm64. See scripts/check-vendored-container.sh.
  vendored:
    name: vendored (${{ matrix.image }}${{ matrix.runner && ', arm64' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: debian-12-ocaml-5.5 }
          - { image: debian-12-ocaml-4.11 }
          - { image: alpine-3.24-ocaml-5.5 }
          - { image: alpine-3.24-ocaml-5.5, runner: ubuntu-24.04-arm }

    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      # Keep dune's cache between runs, so the CMake build of
      # vendor/xgboost (the config/ rule) is restored instead of redone.
      # Dune tracks the rule's declared inputs (discover.exe, vendor/), not
      # the C++ compiler or OpenMP it uses, so the key names the image and
      # architecture. One entry per key: on an exact hit actions/cache
      # saves nothing; a change to vendor/ or config/ makes a new key.
      - name: Restore dune cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dune-cache
          key: dune-${{ matrix.image }}-${{ runner.arch }}-${{ hashFiles('vendor/**', 'config/**') }}

      # The container runs as the image's opam user (uid 1000), not the
      # runner's (1001), so it needs write access to the cache directory.
      # The cache is a mount, on another filesystem than the build, and
      # dune's default hardlink storage then silently stores nothing:
      # copy instead.
      - name: Build, test and check installed linking
        run: |
          mkdir -p "$RUNNER_TEMP/dune-cache"
          chmod -R a+rwX "$RUNNER_TEMP/dune-cache"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/dune-cache:/dune-cache" \
            -e DUNE_CACHE_ROOT=/dune-cache \
            -e DUNE_CACHE_STORAGE_MODE=copy \
            "ocaml/opam:${{ matrix.image }}" \
            sh /src/scripts/check-vendored-container.sh

      # Dune writes its cache files readable by their owner only, the
      # container's opam user, so actions/cache (running as the runner's
      # user) couldn't pack them and saved nothing. Give them back, even
      # when the step above failed.
      - name: Hand the dune cache back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/dune-cache"
