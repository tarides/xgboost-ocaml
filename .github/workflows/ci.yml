name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-version: ["5.1", "5.2", "5.3"]
        # Exercise both native-dependency paths of the hybrid build:
        #   system   — link a system libxgboost >= 3.0 (fast path)
        #   vendored — no system lib; compile vendor/xgboost with CMake
        #              (the opam-repo-ci sandbox scenario)
        mode: [system, vendored]
        # The vendored path is compiler-version-independent, so build it
        # once (on the newest OCaml) to keep CI lean.
        exclude:
          - { ocaml-version: "5.1", mode: vendored }
          - { ocaml-version: "5.2", mode: vendored }

    runs-on: ${{ matrix.os }}

    env:
      # Run libxgboost single-threaded so the test suite is fully
      # deterministic. Hist OpenMP reduction order varies with chunk
      # size and thread count, which makes a few qcheck properties
      # (slice consistency, model-buffer round-trip) drift by ~1e-4
      # — the binding is correct, libxgboost just has FP noise. Pin
      # threads to 1 in CI; bench harness can override.
      OMP_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      # cmake/g++/libgomp are needed everywhere: the conf-cmake/conf-c++
      # build-deps check for them, and the vendored path builds with them.
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake g++ libgomp1

      - name: Install libxgboost 3.0 (system mode only)
        if: matrix.mode == 'system'
        run: |
          # Ubuntu's packaged libxgboost is older than the >=3.0 entry
          # points we bind. Install 3.0.0 from the upstream Python wheel
          # (which carries a prebuilt libxgboost.so) and take the headers
          # from the matching source tag.
          sudo apt-get install -y python3-pip patchelf
          python3 -m pip install --user --break-system-packages xgboost==3.0.0
          XGBOOST_PY=$(python3 -c 'import os, xgboost; print(os.path.dirname(xgboost.__file__))')
          sudo install -m 0644 "$XGBOOST_PY/lib/libxgboost.so" /usr/lib/x86_64-linux-gnu/
          # The wheel was built with auditwheel: libxgboost.so DT_NEEDEDs
          # a hash-name-mangled libgomp-HASH.so.1.0.0 bundled alongside
          # it. Re-point the dependency at the system libgomp so we don't
          # need to ship the mangled file. Discover the mangled name
          # first since the hash is build-specific.
          MANGLED_GOMP=$(patchelf --print-needed /usr/lib/x86_64-linux-gnu/libxgboost.so | grep -E '^libgomp-' || true)
          if [ -n "$MANGLED_GOMP" ]; then
            sudo patchelf --replace-needed "$MANGLED_GOMP" libgomp.so.1 \
              /usr/lib/x86_64-linux-gnu/libxgboost.so
          fi
          # Headers from the matching upstream tag
          git clone --depth 1 --branch v3.0.0 https://github.com/dmlc/xgboost.git /tmp/xgboost-src
          sudo cp -r /tmp/xgboost-src/include/xgboost /usr/include/
          # pkg-config file so config/discover.ml finds it
          sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/xgboost.pc > /dev/null <<'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib/x86_64-linux-gnu
          includedir=${prefix}/include

          Name: xgboost
          Description: XGBoost gradient boosting library
          Version: 3.0.0
          Libs: -L${libdir} -lxgboost
          Cflags: -I${includedir}
          EOF
          sudo ldconfig
          # Sanity check: confirm the symbol we need is present
          nm -D /usr/lib/x86_64-linux-gnu/libxgboost.so | grep -E ' T XGBoosterTrainOneIter$' \
            || (echo "libxgboost.so missing XGBoosterTrainOneIter" && exit 1)

      - name: Set up OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      # --no-depexts keeps the two jobs deterministic: system deps are
      # managed explicitly above so opam never pulls a conflicting
      # distro libxgboost underneath us.
      - name: Install OCaml deps
        run: opam install . --deps-only --with-test --no-depexts --yes

      - name: Lint opam metadata
        run: opam lint xgboost.opam

      - name: Build
        run: opam exec -- dune build -p xgboost -j 4

      - name: Run tests
        run: opam exec -- dune runtest -p xgboost -j 4

      # The pure-C reference and the ASan run both link the system
      # libxgboost, so they only make sense on the system-mode job.
      - name: Build C reference
        if: matrix.mode == 'system'
        run: make -C bin/c_reference

      - name: Run tests under AddressSanitizer
        if: matrix.mode == 'system'
        run: ./scripts/run-asan.sh
