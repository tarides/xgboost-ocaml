name: Distros

# A real opam install (depexts included) plus an installed consumer, on
# the platforms opam-repository CI builds on: its ocaml/opam images
# (amd64 and arm64), macOS with Homebrew, and FreeBSD. Most Linux images
# have no usable system libxgboost and take the vendored path; Debian
# 13/testing, Homebrew and FreeBSD install it through conf-libxgboost's
# depext and take the system path. Each job names the provider it must
# end up with, and fails if opam took the other one. Also: OCaml 4.11
# and 4.14 next to 5.5, and a lower-bounds job. See
# scripts/check-distro-install.sh.
#
# Debian 12 and Ubuntu 26.04 are left out: ci.yml already covers them on
# every PR (vendored-debian in ocaml/opam:debian-12, system on
# ubuntu-latest = 26.04), with the same OCaml and libxgboost.
#
# Too many jobs (most build XGBoost) for every push or PR: run it by hand
# (Actions > Distros > Run workflow) and once a week, which also catches
# distro package updates.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'  # Mondays, 03:17 UTC

permissions:
  contents: read

# One run per ref at a time; a second dispatch waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One opam-repository CI image per job, through docker run. `image` is
  # the ocaml/opam tag, `provider` the native path the job must end up
  # with, `runner` overrides the host (arm64 jobs), and `lower-bounds`
  # makes opam pick the oldest dependency versions xgboost.opam allows.
  install:
    name: ${{ matrix.image }}${{ matrix.runner && ' (arm64)' || '' }}${{ matrix.lower-bounds && ' (lower bounds)' || '' }} → ${{ matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: alpine-3.24-ocaml-5.5, provider: vendored }
          - { image: archlinux-ocaml-5.5, provider: vendored }
          - { image: centos-10-ocaml-5.5, provider: vendored }
          # Oldest RHEL-family toolchain still built (GCC 11).
          - { image: centos-9-ocaml-5.5, provider: vendored }
          # libxgboost-dev 3.0.0: the only job on the exact minimum.
          - { image: debian-13-ocaml-5.5, provider: system }
          # The declared minimum OCaml, through a real opam install.
          - { image: debian-13-ocaml-4.11, provider: system }
          # Oldest versions of every dependency, as opam-repository CI's
          # lower-bounds job does.
          - { image: debian-13-ocaml-5.5, provider: system, lower-bounds: true }
          # libxgboost-dev 3.3.0: the only Linux job on a libxgboost newer
          # than 3.0.x (config/provider has no upper bound).
          - { image: debian-testing-ocaml-5.5, provider: system }
          - { image: fedora-44-ocaml-5.5, provider: vendored }
          # OCaml 4.14 (LTS), between the 4.11 minimum and 5.5.
          - { image: fedora-44-ocaml-4.14, provider: vendored }
          - { image: opensuse-16.0-ocaml-5.5, provider: vendored }
          - { image: opensuse-tumbleweed-ocaml-5.5, provider: vendored }
          # Oldest Ubuntu still built (GCC 11, CMake 3.22, libxgboost 1.5).
          - { image: ubuntu-22.04-ocaml-5.5, provider: vendored }
          - { image: ubuntu-24.04-ocaml-5.5, provider: vendored }
          # arm64, on GitHub's arm64 runners (the images are multi-arch).
          - { image: debian-13-ocaml-5.5, provider: system, runner: ubuntu-24.04-arm }
          - { image: alpine-3.24-ocaml-5.5, provider: vendored, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: opam install and installed consumer
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            -e LOWER_BOUNDS=${{ matrix.lower-bounds && '1' || '0' }} \
            "ocaml/opam:${{ matrix.image }}" \
            sh /src/scripts/check-distro-install.sh ${{ matrix.provider }}

  # Homebrew, with opam installing brew xgboost through conf-libxgboost's
  # depext itself (ci.yml's macOS jobs install it by hand, --no-depexts).
  macos:
    name: macos-latest (Homebrew) → system
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: opam install and installed consumer
        run: SRC="$GITHUB_WORKSPACE" sh scripts/check-distro-install.sh system

  # FreeBSD, in a VM: opam-repository CI tests it, and conf-libxgboost
  # lists it (misc/xgboost is 3.4.2). opam runs as root in the VM.
  freebsd:
    name: freebsd-15 → system
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: opam install and installed consumer
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          copyback: false
          prepare: pkg install -y ocaml-opam gmake pkgconf
          run: |
            set -eu
            export OPAMROOTISOK=1 OPAMYES=1
            opam init --bare --disable-sandboxing --no-setup
            opam switch create default ocaml-base-compiler
            SRC="$PWD" sh scripts/check-distro-install.sh system
