name: Dune next

# Build both native-packaging designs, main and this branch, against the
# next dune release, on the vendored path. dune 3.25 sandboxes Ctypes stub
# generation and its C compilation (#16223), so a ctypes stanza can no
# longer reach undeclared files through relative paths. main's link flags
# carry a relative -Lsrc/bindings; this branch's carry none.

on:
  push:
    branches: ['experiment/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        design: [main, branch]
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      DUNE_TARBALL: https://github.com/ocaml/dune/releases/download/3.25.0_alpha0/dune-3.25.0.alpha0.tbz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.design == 'main' && 'main' || github.sha }}

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake g++ libgomp1

      - name: Set up OCaml 5.5
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: Pin dune 3.25.0~alpha0
        run: |
          opam pin add -n -y dune "$DUNE_TARBALL"
          opam pin add -n -y dune-configurator "$DUNE_TARBALL"
          opam install -y dune dune-configurator
          opam exec -- dune --version

      - name: Install OCaml deps
        run: opam install ./xgboost.opam --deps-only --with-test --no-depexts --yes

      - name: Force vendored discovery
        run: |
          mkdir -p "$RUNNER_TEMP/empty-pkgconfig"
          echo 'PKG_CONFIG_PATH=' >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/empty-pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: opam exec -- dune build -p xgboost -j 4

      - name: Run tests
        run: opam exec -- dune runtest -p xgboost -j 4

      - name: Check installed consumer linking
        env:
          REUSE_BUILD: "1"
        run: bash scripts/check-installed-linking.sh "$GITHUB_WORKSPACE" vendored
